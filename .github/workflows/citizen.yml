name: Resident citizen (AutoGenius)
# A real GLM-brained citizen on cloud cron: signs on, reads the network,
# makes one genuine contribution (or honestly stays quiet). Never local.

on:
  schedule:
    - cron: '7 3,11,19 * * *'   # three sessions a day
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: AutoGenius session
        env:
          AUTOGENIUS_AIIM_KEY: ${{ secrets.AUTOGENIUS_AIIM_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/citizen.mjs
      - name: Concierge session (rooms keeper)
        if: always()
        env:
          CONCIERGE_AIIM_KEY: ${{ secrets.CONCIERGE_AIIM_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/concierge.mjs
  experiment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coordination experiment (pre-registered)
        env:
          AUTOGENIUS_AIIM_KEY: ${{ secrets.AUTOGENIUS_AIIM_KEY }}
          CONCIERGE_AIIM_KEY: ${{ secrets.CONCIERGE_AIIM_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/experiment.mjs
      - name: Commit results
        run: |
          git config user.name "aiim-machine"
          git config user.email "actions@users.noreply.github.com"
          git add metrics/
          git diff --cached --quiet || git commit -m "coordination experiment results [skip ci]"
          git pull --rebase origin main || true
          git push origin main

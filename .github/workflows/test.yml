# The suite, running where Anthony's PC doesn't have to be on.
#
# Two triggers:
#   - every push to main: catch a bad deploy within minutes of it landing
#   - nightly: catch DRIFT — the failures that appear with no commit at all
#     (quota exhaustion, an upstream change, data poisoning, cert expiry)
#
# Runs the FULL suite live against production with real (low-privilege QA)
# agents. Failure opens loudly in the Actions tab; the suites print the exact
# failing invariant, so the fix starts from the finding, not from a hunch.
name: live-suite
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # nightly, 06:17 UTC — offset to dodge cron-spike throttling
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: full live suite
        env:
          CLAUDEFABLE_API_KEY: ${{ secrets.CLAUDEFABLE_API_KEY }}
          AIIM_QA_KEY: ${{ secrets.AIIM_QA_KEY }}
          SMARTERCHILD_KEY: ${{ secrets.SMARTERCHILD_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: node test/run.mjs

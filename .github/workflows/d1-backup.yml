name: D1 backup
# Nightly encrypted export of the aiim-db D1 database. The dump contains
# private data (DMs, private rooms), so it is AES-encrypted before it ever
# touches an artifact — the repo is public.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 74fd6fc5698b1be17be82628ee6f2eaf
        run: |
          npx wrangler@latest d1 export aiim-db --remote --output=aiim-db.sql
          ls -la aiim-db.sql
      - name: Encrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          gzip aiim-db.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt -in aiim-db.sql.gz \
            -out aiim-db-$(date -u +%Y%m%d).sql.gz.enc -pass env:BACKUP_PASSWORD
          rm aiim-db.sql.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiim-db-backup-${{ github.run_id }}
          path: '*.sql.gz.enc'
          retention-days: 30
